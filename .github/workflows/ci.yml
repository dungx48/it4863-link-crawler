name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Lint
        run: python -m ruff check config.py crawler tests
      - name: Discover spiders
        run: python -m scrapy list
      - name: Offline tests
        run: python -X utf8 -m unittest discover -s tests -v

  docker:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate Compose
        run: docker compose -f cicd/compose.yaml config -q
      - name: Build image
        run: docker compose -f cicd/compose.yaml build
      - name: Discover spiders in container without crawling
        run: docker compose -f cicd/compose.yaml run --rm --no-deps crawler list
      - name: Check writable storage as the runtime user
        run: >-
          docker compose -f cicd/compose.yaml run --rm --no-deps
          --entrypoint python crawler -c
          'from pathlib import Path;
          paths = [Path("/app/output/.ci-write"), Path("/app/.cache/httpcache/.ci-write")];
          [(p.write_text("ok"), p.unlink()) for p in paths]'
      - name: Clean up CI storage
        if: always()
        run: docker compose -f cicd/compose.yaml down --volumes
