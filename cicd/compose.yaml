services:
  crawler:
    build:
      context: ..
      dockerfile: cicd/Dockerfile
    environment:
      HUST_LINKS_OUT: /app/output/links.txt
      HUST_ALLOW_SUBDOMAINS: ${HUST_ALLOW_SUBDOMAINS:-1}
      HUST_UA: ${HUST_UA:-HustIRBot/1.0 (+academic information-retrieval coursework; contact local)}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - links:/app/output
      - httpcache:/app/.cache/httpcache
    restart: "no"

  crawler-api:
    extends:
      service: crawler
    profiles: [server]
    entrypoint: ["python"]
    command: ["-m", "crawler.service"]
    environment:
      CRAWLER_API_TOKEN: ${CRAWLER_API_TOKEN:-}
      CRAWLER_MAX_PAGES: ${CRAWLER_MAX_PAGES:-2500}
      CRAWLER_DEPTH_LIMIT: ${CRAWLER_DEPTH_LIMIT:-4}
      CRAWLER_TIMEOUT_SECONDS: ${CRAWLER_TIMEOUT_SECONDS:-21600}
    ports:
      - "127.0.0.1:${CRAWLER_API_PORT:-8000}:8000"
    init: true
    stop_grace_period: 60s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  links:
  httpcache:
